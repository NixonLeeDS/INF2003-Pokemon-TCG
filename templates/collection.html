{% extends 'base.html' %}
{% block content %}
<h2>Collection</h2>
<form method="get"><label>User <select name="user_id" onchange="this.form.submit()">{% for u in all_users %}<option value="{{ u.user_id }}" {% if u.user_id==user_id %}selected{% endif %}>{{ u.username }}</option>{% endfor %}</select></label></form>
<form method="post" class="inline-form"><input type="hidden" name="user_id" value="{{ user_id }}"><input name="card_id" placeholder="Card ID e.g. base1-1" required><input name="quantity" type="number" min="0" value="1"><input name="trade_quantity" type="number" min="0" value="0"><button name="action" value="upsert">Add / Update</button></form>
<table><thead><tr><th>Card</th><th>Set</th><th>Qty</th><th>Tradeable</th><th></th></tr></thead><tbody>{% for r in rows %}<tr><td>{{ r.card_name }}<small>{{ r.card_id }}</small></td><td>{{ r.set_name }}</td><td>{{ r.quantity }}</td><td>{{ r.trade_quantity }}</td><td><form method="post"><input type="hidden" name="user_id" value="{{ user_id }}"><input type="hidden" name="card_id" value="{{ r.card_id }}"><button name="action" value="remove">Remove</button></form></td></tr>{% endfor %}</tbody></table>
{% endblock %}
