<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.title{font-size:26px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.layer{font-size:12px;font-weight:700;letter-spacing:.5px}.boxTitle{font-size:14px;font-weight:700}.boxText{font-size:11px}.note{font-size:11px}.edge{fill:none;stroke-width:2}.dash{stroke-dasharray:7 6}.small{font-size:10px;fill:#6b7280}
</style>
<defs>
<marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/></marker>
<marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f97316"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#10b981"/></marker>
<marker id="pink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#db2777"/></marker>
<marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/></marker>
</defs>
<rect width="1500" height="930" fill="#ffffff"/>
<text x="750" y="42" text-anchor="middle" class="title">Pokémon TCG Collection and Trading Management System</text>
<text x="750" y="67" text-anchor="middle" class="sub">Proposed System Architecture</text>

<rect x="620" y="95" width="240" height="58" rx="12" fill="#e8f0fe" stroke="#3b82f6" stroke-width="2"/>
<text x="740" y="130" text-anchor="middle" class="boxTitle">Collector / User</text>

<rect x="310" y="185" width="860" height="105" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="330" y="207" class="layer">PRESENTATION LAYER</text>
<rect x="430" y="225" width="620" height="48" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="740" y="246" text-anchor="middle" class="boxTitle">Flask Web Interface</text>
<text x="740" y="264" text-anchor="middle" class="boxText">Card Search • Collection • Wishlist • Trades • Analytics</text>

<rect x="180" y="325" width="1120" height="190" rx="12" fill="#fafafa" stroke="#cbd5e1" stroke-width="2"/>
<text x="200" y="347" class="layer">APPLICATION / BUSINESS LOGIC LAYER</text>
<g>
<rect x="220" y="370" width="240" height="65" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
<text x="340" y="397" text-anchor="middle" class="boxTitle">Card Catalogue Service</text><text x="340" y="417" text-anchor="middle" class="boxText">Search, filter and card detail</text>
<rect x="485" y="370" width="250" height="65" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
<text x="610" y="397" text-anchor="middle" class="boxTitle">Collection &amp; Wishlist Service</text><text x="610" y="417" text-anchor="middle" class="boxText">CRUD, quantities and priorities</text>
<rect x="760" y="370" width="250" height="65" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
<text x="885" y="397" text-anchor="middle" class="boxTitle">Trading Service</text><text x="885" y="417" text-anchor="middle" class="boxText">Matching and atomic completion</text>
<rect x="1035" y="370" width="225" height="65" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="1147" y="397" text-anchor="middle" class="boxTitle">Analytics Service</text><text x="1147" y="417" text-anchor="middle" class="boxText">SQL + MongoDB analysis</text>
</g>
<rect x="350" y="455" width="780" height="38" rx="9" fill="#fff" stroke="#d1d5db" stroke-dasharray="6 5"/>
<text x="740" y="479" text-anchor="middle" class="note" fill="#475569">Cross-database integration combines relational data with nested card attributes where required.</text>

<rect x="280" y="550" width="920" height="115" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="300" y="572" class="layer">DATABASE ACCESS LAYER</text>
<rect x="350" y="590" width="350" height="55" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
<text x="525" y="613" text-anchor="middle" class="boxTitle">Relational Service</text><text x="525" y="632" text-anchor="middle" class="boxText">PyMySQL • joins • constraints • transactions</text>
<rect x="780" y="590" width="350" height="55" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="955" y="613" text-anchor="middle" class="boxTitle">MongoDB Service</text><text x="955" y="632" text-anchor="middle" class="boxText">PyMongo • nested queries • aggregation pipeline</text>

<rect x="280" y="700" width="920" height="165" rx="12" fill="#fafafa" stroke="#cbd5e1" stroke-width="2"/>
<text x="300" y="722" class="layer">DATA STORAGE LAYER</text>
<ellipse cx="490" cy="753" rx="125" ry="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><rect x="365" y="753" width="250" height="64" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><ellipse cx="490" cy="817" rx="125" ry="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="490" y="782" text-anchor="middle" class="boxTitle">MariaDB</text><text x="490" y="801" text-anchor="middle" class="boxText">Relational Database</text>
<ellipse cx="990" cy="753" rx="125" ry="16" fill="#d1fae5" stroke="#059669" stroke-width="2"/><rect x="865" y="753" width="250" height="64" fill="#d1fae5" stroke="#059669" stroke-width="2"/><ellipse cx="990" cy="817" rx="125" ry="16" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="990" y="782" text-anchor="middle" class="boxTitle">MongoDB</text><text x="990" y="801" text-anchor="middle" class="boxText">Document Database</text>
<text x="490" y="846" text-anchor="middle" class="note" fill="#7c2d12">Users • Sets • Cards • Collections • Wishlists • Trades</text>
<text x="490" y="862" text-anchor="middle" class="note" fill="#7c2d12">PK/FK • CHECK • Views • Indexes • ACID trade completion</text>
<text x="990" y="846" text-anchor="middle" class="note" fill="#065f46">Abilities • Attacks • Weaknesses • Legalities • Rules</text>
<text x="990" y="862" text-anchor="middle" class="note" fill="#065f46">$unwind • $group • $avg • nested field queries</text>

<rect x="20" y="575" width="210" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="125" y="601" text-anchor="middle" class="boxTitle">Pokémon TCG CSV</text><text x="125" y="621" text-anchor="middle" class="boxText">17,172 cards • 29 attributes</text>
<rect x="20" y="690" width="210" height="78" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
<text x="125" y="716" text-anchor="middle" class="boxTitle">Import / Transformation</text><text x="125" y="736" text-anchor="middle" class="boxText">clean • normalize • derive set_id</text><text x="125" y="753" text-anchor="middle" class="boxText">parse nested fields</text>

<path d="M740 153 V225" class="edge" stroke="#3b82f6" marker-end="url(#blue)"/><text x="752" y="188" class="small">HTTP</text>
<path d="M740 273 V350 H610 V370" class="edge" stroke="#64748b" marker-end="url(#blue)"/>
<path d="M340 435 V535 H525 V590" class="edge" stroke="#f97316" marker-end="url(#orange)"/>
<path d="M610 435 V545 H525 V590" class="edge" stroke="#f97316" marker-end="url(#orange)"/>
<path d="M885 435 V535 H525 V590" class="edge" stroke="#db2777" stroke-width="3" marker-end="url(#pink)"/><text x="710" y="526" class="small">atomic transaction</text>
<path d="M1147 435 V520 H955 V590" class="edge" stroke="#10b981" stroke-width="3" marker-end="url(#green)"/><text x="990" y="510" class="small">aggregation pipeline</text>
<path d="M1147 435 V500 H525 V590" class="edge" stroke="#f97316" marker-end="url(#orange)"/>
<path d="M340 435 V520 H955 V590" class="edge" stroke="#10b981" marker-end="url(#green)"/>
<path d="M525 645 V735" class="edge" stroke="#ea580c" marker-end="url(#orange)"/><text x="538" y="690" class="small">SQL</text>
<path d="M955 645 V735" class="edge" stroke="#059669" marker-end="url(#green)"/><text x="968" y="690" class="small">BSON</text>
<path d="M125 637 V690" class="edge" stroke="#d97706" marker-end="url(#gold)"/>
<path d="M230 729 H310 V780 H365" class="edge dash" stroke="#d97706" marker-end="url(#gold)"/><text x="260" y="720" class="small">structured</text>
<path d="M230 745 H760 V780 H865" class="edge dash" stroke="#d97706" marker-end="url(#gold)"/><text x="545" y="738" class="small">nested fields</text>

<text x="750" y="905" text-anchor="middle" class="small">Solid arrows = runtime application flow   •   Dashed arrows = repeatable dataset ingestion</text>
</svg>